<svg xmlns="http://www.w3.org/2000/svg"
width="490"
height="430"
viewBox="0 0 490 430">

<style>

.title {
    font-family: monospace;
    font-size: 18px;
    font-weight: bold;
    fill: #8b949e;
}

.subtitle {
    font-family: monospace;
    font-size: 13px;
    fill: #8b949e;
}

.key {
    font-family: monospace;
    font-size: 13px;
    font-weight: bold;
    fill: #8b949e;
}

.value {
    font-family: monospace;
    font-size: 13px;
    fill: #8b949e;
}

.line {
    stroke: #8b949e;
    stroke-width: 1;
    opacity: 0.5;
}

.row {
    opacity: 0;
    animation: fadeIn 0.5s ease-out forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateX(10px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

</style>

<text x="20" y="30" class="title">
HARSH@GITHUB
</text>

<text x="20" y="52" class="subtitle">
────────────────────────────────────────────
</text>

<text x="20" y="78" class="subtitle">
DATA • AI • SOFTWARE
</text>

<line x1="20" y1="92" x2="465" y2="92" class="line"/>

<g class="row" style="animation-delay:0.00s">

<text
    x="20"
    y="120"
    class="key">
    NAME
</text>

<text
    x="145"
    y="120"
    class="value">
    Harsh Meena
</text>

</g>

<g class="row" style="animation-delay:0.12s">

<text
    x="20"
    y="144"
    class="key">
    ROLE
</text>

<text
    x="145"
    y="144"
    class="value">
    Data Analyst | BI Analyst
</text>

</g>

<g class="row" style="animation-delay:0.24s">

<text
    x="20"
    y="168"
    class="key">
    FOCUS
</text>

<text
    x="145"
    y="168"
    class="value">
    SQL • Power BI • Python
</text>

</g>

<g class="row" style="animation-delay:0.36s">

<text
    x="20"
    y="192"
    class="key">
    TOOLS
</text>

<text
    x="145"
    y="192"
    class="value">
    Excel • pandas • DAX
</text>

</g>

<g class="row" style="animation-delay:0.48s">

<text
    x="20"
    y="216"
    class="key">
    PROJECTS
</text>

<text
    x="145"
    y="216"
    class="value">
    Independent practice work
</text>

</g>

<g class="row" style="animation-delay:0.60s">

<text
    x="20"
    y="240"
    class="key">
    STATUS
</text>

<text
    x="145"
    y="240"
    class="value">
    Building analytics projects
</text>

</g>

<line x1="20" y1="405" x2="465" y2="405" class="line"/>

<text x="20" y="425" class="subtitle">
STATUS: BUILDING • LEARNING • SHIPPING
</text>

</svg>
